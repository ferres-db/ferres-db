[package]
name = "ferres-db-server"
version = "0.1.0"
edition = "2021"
description = "Servidor HTTP/gRPC do FerresDB"
license = "MIT"

[lib]
name = "ferres_db_server"
path = "src/lib.rs"

[[bin]]
name = "ferres-db-server"
path = "src/main.rs"

[features]
default = []
# Distributed tracing: export spans to OpenTelemetry (Jaeger, OTLP). Requires OTEL_EXPORTER_OTLP_ENDPOINT.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp"]

[dependencies]
ferres-db-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower_governor = { version = "0.6", features = ["axum"] }
governor = "0.8"
thiserror = { workspace = true }
toml = "0.8"
dotenvy = "0.15"
chrono = { workspace = true }
validator = { version = "0.18", features = ["derive"] }
regex = "1.10"
lazy_static = "1.5"
dashmap = "6"
tokio-stream = "0.1"
prometheus = "0.13"
uuid = { workspace = true }
sysinfo = "0.31"
fs4 = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
getrandom = "0.2"
argon2 = "0.5"
jsonwebtoken = "9.2"
rand_core = { version = "0.6", features = ["getrandom"] }

# Optional: OpenTelemetry export (feature "otel"); build with --features otel
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", optional = true }
tracing-opentelemetry = { version = "0.29", optional = true }
opentelemetry-otlp = { version = "0.28", features = ["trace", "grpc-tonic"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3.10"
quickcheck = "1.0"
quickcheck_macros = "1.0"
rand = "0.8"
futures = "0.3"
