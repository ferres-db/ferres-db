[package]
name = "ferres-db-sdk"
version = "0.1.0"
edition = "2021"
description = "FerresDB vector search engine — collections, points, storage and HNSW search"
license = "MIT OR Apache-2.0"
authors = ["Rafael Ferrés"]
repository = "https://github.com/ferres-db/ferres-db"
readme = "../../README.md"

[dependencies]
ferres-db-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
http = "1"
async-trait = "0.1"
