server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    # gzip_vary: tells proxies/CDNs to cache both compressed and plain variants.
    # gzip_min_length: skip compression for tiny responses (no gain below ~1 KB).
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/x-javascript application/xml+rss application/javascript
        application/json application/atom+xml image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    # Generated at container start-up by docker-entrypoint.sh so the
    # Content-Security-Policy connect-src can include FERRESDB_API_URL.
    #
    # X-Frame-Options DENY
    #   Blocks all iframe embedding of this page (clickjacking defence).
    #   Change to SAMEORIGIN only if you need to iframe your own domain.
    #
    # X-Content-Type-Options nosniff
    #   Forces browsers to respect the declared Content-Type and not sniff
    #   bytes. Prevents drive-by-download exploits and MIME-based XSS.
    #
    # Referrer-Policy same-origin
    #   Sends the Referer header only on same-origin navigations.
    #   Upgrade to strict-origin-when-cross-origin to share just the origin
    #   on cross-origin requests, or no-referrer for maximum privacy.
    #
    # Permissions-Policy
    #   Opts this origin out of geolocation, microphone, and camera APIs.
    #   Extend the list (e.g. fullscreen=*, display-capture=()) if the app
    #   ever needs additional browser features.
    #
    # Content-Security-Policy
    #   script-src 'self'             — only same-origin scripts; no eval/inline
    #   style-src 'self' 'unsafe-inline' — Tailwind injects styles at runtime
    #   connect-src 'self' [API_URL] ws: wss: — API origin + WebSocket support
    #   frame-ancestors 'none'        — CSP equivalent of X-Frame-Options DENY
    #   To add an API origin: set FERRESDB_API_URL=https://your-api in .env
    #
    # NGINX INHERITANCE NOTE: add_header in a location block suppresses all
    # add_header directives from parent blocks for that location. Locations
    # that define their own add_header (config.js, assets) must therefore
    # explicitly include this snippet again — see the locations below.
    include /etc/nginx/snippets/security_headers.conf;

    # Config em runtime (gerado pelo entrypoint) — sem cache
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security_headers.conf;  # see inheritance note above
    }

    # SPA fallback — no add_header here, so security headers are inherited
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable asset cache — repeat snippet for same reason as config.js
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security_headers.conf;  # see inheritance note above
    }
}
