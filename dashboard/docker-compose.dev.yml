version: '3.8'

services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ferres-dashboard-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_API_KEY=sk-dev-abc123
    command: npm run dev -- --host 0.0.0.0
    networks:
      - ferres-network
    restart: unless-stopped

networks:
  ferres-network:
    external: true
