# Portas e config em runtime via .env (copie .env.docker.example para .env).
# Backend: PORT, STORAGE_PATH, LOG_LEVEL, CORS_ORIGINS
# Frontend: VITE_API_BASE_URL, VITE_API_KEY (usados pelo entrypoint em runtime)

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferres-db-core
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    volumes:
      - ferres-data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=${BACKEND_PORT:-8080}
      - STORAGE_PATH=${STORAGE_PATH:-/data}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - FERRESDB_ENABLE_MCP=${FERRESDB_ENABLE_MCP:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8080}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - ferres-network

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ferres-db-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
      - VITE_API_KEY=${VITE_API_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ferres-network

volumes:
  ferres-data:
    driver: local

networks:
  ferres-network:
    driver: bridge
