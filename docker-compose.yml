# Portas e configurações podem ser alteradas via variáveis de ambiente.
# Crie um arquivo .env na mesma pasta ou exporte antes de subir:
#   BACKEND_PORT=8080
#   FRONTEND_PORT=3000
#   LOG_LEVEL=info
#   VITE_API_BASE_URL=http://localhost:8080

version: '3.8'

services:
  # Backend Rust API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferres-db-backend
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    volumes:
      - ferres-data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=${BACKEND_PORT:-8080}
      - STORAGE_PATH=${STORAGE_PATH:-/data}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8080}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - ferres-network

  # Frontend React (Produção)
  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_API_KEY: ${VITE_API_KEY:-}
    container_name: ferres-db-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ferres-network

volumes:
  ferres-data:
    driver: local

networks:
  ferres-network:
    driver: bridge
