version: '3.8'

services:
  vector-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferres-db
    ports:
      - "8080:8080"
    volumes:
      - ferres-data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - STORAGE_PATH=/data
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - ferres-network

volumes:
  ferres-data:
    driver: local

networks:
  ferres-network:
    driver: bridge
