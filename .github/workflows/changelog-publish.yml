# Publica automaticamente entradas do CHANGELOG.md como GitHub Releases
# e opcionalmente notifica serviços externos (Headwayapp / Changelogfy).
#
# Dispara quando CHANGELOG.md é modificado em push na main.
# Requer secrets:
#   - HEADWAYAPP_TOKEN    → token da API do Headwayapp (opcional)
#   - CHANGELOGFY_TOKEN   → token da API do Changelogfy (opcional)
#   - GH_PAT              → Personal Access Token com permissão `contents:write`
#                           (ou use o GITHUB_TOKEN padrão se o repo for público)

name: Publish Changelog

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não cria release nem publica)"
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necessário para criar GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # precisamos do commit anterior para diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ─── 1. Parseia o CHANGELOG e detecta releases novas ────────────────
      - name: Parse CHANGELOG
        id: parse
        run: python .github/scripts/parse_changelog.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      # ─── 2. Cria GitHub Release (se houver release nova) ─────────────────
      - name: Create GitHub Release
        if: steps.parse.outputs.has_new_release == 'true' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.version_tag }}
          name: ${{ steps.parse.outputs.release_title }}
          body: ${{ steps.parse.outputs.release_body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── 3. Publica no Headwayapp (opcional) ─────────────────────────────
      - name: Publish to Headwayapp
        if: >
          steps.parse.outputs.has_new_release == 'true' &&
          github.event.inputs.dry_run != 'true' &&
          secrets.HEADWAYAPP_TOKEN != ''
        run: python .github/scripts/publish_headway.py
        env:
          HEADWAYAPP_TOKEN: ${{ secrets.HEADWAYAPP_TOKEN }}
          RELEASE_TITLE: ${{ steps.parse.outputs.release_title }}
          RELEASE_BODY: ${{ steps.parse.outputs.release_body }}
          RELEASE_DATE: ${{ steps.parse.outputs.release_date }}

      # ─── 4. Publica no Changelogfy (opcional — alternativa ao Headwayapp) ─
      - name: Publish to Changelogfy
        if: >
          steps.parse.outputs.has_new_release == 'true' &&
          github.event.inputs.dry_run != 'true' &&
          secrets.CHANGELOGFY_TOKEN != ''
        run: python .github/scripts/publish_changelogfy.py
        env:
          CHANGELOGFY_TOKEN: ${{ secrets.CHANGELOGFY_TOKEN }}
          RELEASE_TITLE: ${{ steps.parse.outputs.release_title }}
          RELEASE_BODY: ${{ steps.parse.outputs.release_body }}
          RELEASE_DATE: ${{ steps.parse.outputs.release_date }}

      # ─── 5. Resumo no Actions ────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## Changelog Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.parse.outputs.has_new_release }}" == "true" ]; then
            echo "✅ **Nova release detectada:** \`${{ steps.parse.outputs.version_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Título:** ${{ steps.parse.outputs.release_title }}" >> $GITHUB_STEP_SUMMARY
            echo "**Data:** ${{ steps.parse.outputs.release_date }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Nenhuma release nova detectada. Apenas \`[Unreleased]\` foi modificado." >> $GITHUB_STEP_SUMMARY
          fi