name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "23 4 * * 1" # segunda-feira 4h23 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: 🔍 Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read # required by codeql-action
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
        # Rust não é suportado oficialmente pelo CodeQL ainda;
        # use cargo-audit no CI separadamente se quiser.

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history needed for pr-diff-range; shallow clone causes "undefined" line numbers
      - uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          category: "/language:${{ matrix.language }}"