# Build multi-arch, security scan, SBOM, signing e push das imagens Docker.
# Só roda em push para main/develop e tags v*.

name: Docker Publish

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false # Não cancelar publish em andamento

jobs:
  semver:
    name: 🔢 Calculate Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
      changed: ${{ steps.semver.outputs.changed }}
      is_tagged: ${{ steps.semver.outputs.is_tagged }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: semver
        uses: PaulHatch/semantic-version@de157b15a0825b9ce4e2bce0664de4f23dbcca9f # v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "/(BREAKING CHANGE)|!:/"
          major_regexp_flags: "i"
          minor_pattern: "/^feat(\\(.+\\))?:/"
          minor_regexp_flags: "i"
          search_commit_body: true
          bump_each_commit: false
          version_format: "{major}.{minor}.{patch}"

  build:
    name: 🐳 Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [semver]
    if: |
      always() &&
      (needs.semver.result == 'success' || needs.semver.result == 'skipped')
    permissions:
      contents: read
      packages: write
      id-token: write # para cosign
      attestations: write # para SBOM/provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ferres-db-core
            context: .
            dockerfile: ./Dockerfile
          - image: ferres-db-frontend
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.DOCKER_NAMESPACE }}/${{ matrix.image }}
          tags: |
            # Branch develop → tag "develop" e "develop-{sha}"
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=develop-,enable=${{ github.ref == 'refs/heads/develop' }}
            # Branch main → tag "latest" e versão semântica
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.semver.outputs.version_tag }},enable=${{ github.ref == 'refs/heads/main' && needs.semver.outputs.changed == 'true' }}
            # Tag v* → versão completa + major + major.minor
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

      - name: Sign image with cosign (keyless)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: "sarif"
          output: "trivy-${{ matrix.image }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # não falhar build, só reportar
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.1
        if: always()
        with:
          sarif_file: "trivy-${{ matrix.image }}.sarif"
          category: "trivy-${{ matrix.image }}"